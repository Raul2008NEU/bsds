services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: album
      POSTGRES_PASSWORD: album
      POSTGRES_DB: albumdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U album -d albumdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://album:album@postgres:5432/albumdb"
      S3_BUCKET: album-photos
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
