version: '3.8'

services:
  node1:
    image: kv-node
    environment:
      - NODE_ID=node1
      - ROLE=leaderless
      - PEERS=node2:8080,node3:8080,node4:8080,node5:8080
      - R=1
      - W=5
      - PORT=8080
    ports:
      - "8081:8080"
    networks:
      - kvnet

  node2:
    image: kv-node
    environment:
      - NODE_ID=node2
      - ROLE=leaderless
      - PEERS=node1:8080,node3:8080,node4:8080,node5:8080
      - R=1
      - W=5
      - PORT=8080
    ports:
      - "8082:8080"
    networks:
      - kvnet

  node3:
    image: kv-node
    environment:
      - NODE_ID=node3
      - ROLE=leaderless
      - PEERS=node1:8080,node2:8080,node4:8080,node5:8080
      - R=1
      - W=5
      - PORT=8080
    ports:
      - "8083:8080"
    networks:
      - kvnet

  node4:
    image: kv-node
    environment:
      - NODE_ID=node4
      - ROLE=leaderless
      - PEERS=node1:8080,node2:8080,node3:8080,node5:8080
      - R=1
      - W=5
      - PORT=8080
    ports:
      - "8084:8080"
    networks:
      - kvnet

  node5:
    image: kv-node
    environment:
      - NODE_ID=node5
      - ROLE=leaderless
      - PEERS=node1:8080,node2:8080,node3:8080,node4:8080
      - R=1
      - W=5
      - PORT=8080
    ports:
      - "8085:8080"
    networks:
      - kvnet

networks:
  kvnet:
    driver: bridge
